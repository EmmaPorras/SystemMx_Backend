name: Backend CI & Build Check

on:
  push:
    branches:
      - main
      - deploy-neon
      - prep-entrega-final
  pull_request:
    branches:
      - main
      - deploy-neon
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

      - name: Run unit & integration tests
        run: npm test -- --runInBand
