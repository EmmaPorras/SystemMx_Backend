name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  #Si se esta subiendo corriendo otro ci, cancela la ejecucion anterior
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      #descarga el codigo del repo en la maquina virtual
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
      #Realiza una instalacion limpia de dependencias
      - name: Install dependencies (clean install)
        run: npm ci
      #Realiza una revision de codigo, sin autofix
      - name: Lint check (sin autofix)
        run: npm run lint:ci
      #Realiza la compilacion del backend y que funcione correctamente
      - name: Build backend application
        run: npm run build
      #Realiza los tests de unidad e integracion
      - name: Run unit and integration tests
        #evita que la maquina virtual se quede sin memoria
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 1433
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_database
          JWT_SECRET: dummy_secret_key_for_ci_testing_at_least_32_chars
          CORS_ORIGINS: http://localhost:5173
  # Job de seguridad: Semgrep CE, Gitleaks y OSV-Scanner (Ítem 3.2)
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        #Descarga el historial completo del commits, no solo el ultimo commit
        with:
          fetch-depth: 0

      - name: Create reports directory
        run: mkdir -p reports

      # 1. GITLEAKS (Detección de secretos y credenciales)
      - name: Install Gitleaks v8.30.1
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version

      - name: Run Gitleaks (Git History & Working Tree)
        run: |
          echo "==> Escaneando historial completo de commits con Gitleaks..."
          gitleaks git --config=.gitleaks.toml --redact --report-path reports/gitleaks-report.json --report-format json --verbose
          echo "==> Escaneando arbol de trabajo actual con Gitleaks..."
          gitleaks dir . --config=.gitleaks.toml --redact --no-banner

      # 2. SEMGREP CE (Análisis estático de código / SAST)
      - name: Setup Python for Semgrep
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install Semgrep CE v1.184.0
        run: |
          pip install semgrep==1.184.0
          semgrep --version

      - name: Run Semgrep CE (SAST)
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/nodejs \
            --config p/owasp-top-ten \
            --config .semgrep/ \
            --metrics=off \
            --error \
            --severity=ERROR \
            --sarif-output reports/semgrep.sarif \
            src test scripts

      # 3. OSV-SCANNER (Análisis de composición de software / SCA en dependencias)
      - name: Install OSV-Scanner v1.9.2
        run: |
          curl -sSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v1.9.2/osv-scanner_linux_amd64
          echo "d6af4b67fa5de658598bd2d445efb99e90d1734b3146962418719c4350ecb74b  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/
          osv-scanner --version

      - name: Run OSV-Scanner (Dependencies SCA)
        run: |
          echo "==> Analizando package-lock.json con OSV-Scanner..."
          set +e
          osv-scanner scan \
            --config osv-scanner.toml \
            --lockfile package-lock.json \
            --format json \
            --output reports/osv-report.json
          osv_exit=$?
          set -e
          if [ -f reports/osv-report.json ]; then
            node -e 'const r=require("./reports/osv-report.json"); const vs=(r.results||[]).flatMap(x=>x.packages||[]).flatMap(p=>(p.vulnerabilities||[]).map(v=>`${p.package.name}@${p.package.version}: ${v.id}`)); console.log(`Vulnerabilidades no exceptuadas: ${vs.length}`); vs.forEach(x=>console.log(" -", x));'
          fi
          exit "$osv_exit"

      # 4. SUBIDA DE REPORTES DE SEGURIDAD
      - name: Upload Security Reports
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: security-reports-${{ github.sha }}
          path: reports/
          retention-days: 7

  # Job de pruebas de autorización con base de datos efímera (Ítem 4.5)
  authz:
    name: authz
    runs-on: ubuntu-latest
    needs: [quality]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: systemmx_authz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Build backend application
        run: npm run build

      - name: Run TypeORM migrations on ephemeral PostgreSQL
        run: npm run migration:run:dist
        env:
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: systemmx_authz

      - name: Run authorization test suite (Supertest)
        run: npm run test:authz
        env:
          NODE_ENV: test
          DB_TYPE: postgres
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: systemmx_authz
          JWT_SECRET: dummy_secret_key_for_ci_testing_at_least_32_chars
          CORS_ORIGINS: http://localhost:5173

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    #Si cuality no pasa, este job no se ejecutara
    needs: [quality]
    steps:
      #descarga el codigo del repo en la maquina virtual para leer el Dockerfile y el contexto de la app
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #Construye imagen a partir de Dockerfile
      - name: Build Docker image candidate
        run: docker build -t systemmx-backend:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} .
      #Exporta la imagen creada a un archivo tar
      - name: Save Docker image to tar archive
        run: docker save systemmx-backend:${{ github.sha }} -o backend-image.tar
      #Sube el archivo tar como artifact para usarlo en el job de despliegue
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: backend-image-${{ github.sha }}
          #Indica lo que se debe de subir a Github action 
          path: backend-image.tar
          retention-days: 1
