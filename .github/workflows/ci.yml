name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  #Si se esta subiendo corriendo otro ci, cancela la ejecucion anterior
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      #descarga el codigo del repo en la maquina virtual
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm
      #Realiza una instalacion limpia de dependencias
      - name: Install dependencies (clean install)
        run: npm ci
      #Realiza una revision de codigo, sin autofix
      - name: Lint check (sin autofix)
        run: npm run lint:ci
      #Realiza la compilacion del backend y que funcione correctamente
      - name: Build backend application
        run: npm run build
      #Realiza los tests de unidad e integracion
      - name: Run unit and integration tests
        #evita que la maquina virtual se quede sin memoria
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 1433
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_database
          JWT_SECRET: dummy_secret_key_for_ci_testing_at_least_32_chars
          CORS_ORIGINS: http://localhost:5173
  #
  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Placeholder de seguridad (Ítem 3.2)
        run: |
          echo "Job 'security' reservado para Semgrep CE, Gitleaks y OSV-Scanner (Ítem 3.2)"

  authz:
    name: authz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Placeholder de pruebas de autorización (Ítem 4.5)
        run: |
          echo "Job 'authz' reservado para suite Supertest de autorización por roles (Ítem 4.5)"

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    #Si cuality no pasa, este job no se ejecutara
    needs: [quality]
    steps:
      #descarga el codigo del repo en la maquina virtual para leer el Dockerfile y el contexto de la app
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      #Construye imagen a partir de Dockerfile
      - name: Build Docker image candidate
        run: docker build -t systemmx-backend:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} .
      #Exporta la imagen creada a un archivo tar
      - name: Save Docker image to tar archive
        run: docker save systemmx-backend:${{ github.sha }} -o backend-image.tar
      #Sube el archivo tar como artifact para usarlo en el job de despliegue
      - name: Upload Docker image artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: backend-image-${{ github.sha }}
          path: backend-image.tar
          retention-days: 1

  release:
    name: Publish approved backend image
    needs: [quality, security, authz, build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    uses: ./.github/workflows/release.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      RENDER_DEPLOY_HOOK_BACKEND: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}