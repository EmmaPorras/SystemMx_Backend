name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean install)
        run: npm ci

      - name: Lint check (sin autofix)
        run: npm run lint:ci

      - name: Build backend application
        run: npm run build

      - name: Run unit and integration tests
        run: npm test -- --runInBand
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 1433
          DB_USERNAME: test_user
          DB_PASSWORD: test_password
          DB_DATABASE: test_database
          JWT_SECRET: dummy_secret_key_for_ci_testing_at_least_32_chars
          CORS_ORIGINS: http://localhost:5173

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Placeholder de seguridad (Ítem 3.2)
        run: |
          echo "Job 'security' reservado para Semgrep CE, Gitleaks y OSV-Scanner (Ítem 3.2)"

  authz:
    name: authz
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Placeholder de pruebas de autorización (Ítem 4.5)
        run: |
          echo "Job 'authz' reservado para suite Supertest de autorización por roles (Ítem 4.5)"

  build-image:
    name: build-image
    runs-on: ubuntu-latest
    needs: [quality]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build Docker image candidate
        run: docker build -t systemmx-backend:${{ github.sha }} --build-arg GIT_SHA=${{ github.sha }} .

      - name: Save Docker image to tar archive
        run: docker save systemmx-backend:${{ github.sha }} -o backend-image.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: backend-image-${{ github.sha }}
          path: backend-image.tar
          retention-days: 1
