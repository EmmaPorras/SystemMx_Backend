services:
  - type: web
    name: systemmx-api-200684331
    runtime: node
    plan: free
    region: virginia
    repo: https://github.com/EmmaPorras/SystemMx_Backend
    branch: deploy-neon
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    initialDeployHook: npm run bootstrap:user:dist
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_SECONDS
        value: "3600"
      - key: CORS_ORIGINS
        value: https://systemmx-web-200684331.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: DB_LOGGING
        value: "false"
      - key: SYSTEMMX_BOOTSTRAP_USERNAME
        sync: false
      - key: SYSTEMMX_BOOTSTRAP_NOMBRE
        sync: false
      - key: SYSTEMMX_BOOTSTRAP_PASSWORD
        sync: false
      - key: SYSTEMMX_MAIL_APPS_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbzhgblogxuMY6fx8toDEl_ni1YeoalG60HDXpfD_HMCzXNUW10oqz__kb4PYtCZ9ftc1w/exec
      - key: SYSTEMMX_MAIL_SECRET
        sync: false
      - key: SYSTEMMX_MAIL_FROM
        value: receptor847@gmail.com
      - key: SYSTEMMX_FRONTEND_URL
        value: https://systemmx-web-200684331.onrender.com

  - type: web
    name: systemmx-web-200684331
    runtime: static
    repo: https://github.com/EmmaPorras/SystemMx_Frontend
    branch: deploy-render
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: VITE_API_URL
        value: https://systemmx-api-200684331.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
